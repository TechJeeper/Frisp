[package]
name = "frisp"
version = "0.1.0"
edition = "2021"
description = "Noise-cancelling virtual microphone"
license = "MIT"
publish = false

[[bin]]
name = "frisp"
path = "src/main.rs"

[[bin]]
name = "frisp-uninstaller"
path = "packaging/windows/uninstaller.rs"

[[bin]]
name = "frisp-installer"
path = "packaging/windows/installer.rs"

[dependencies]
anyhow = "1"
cpal = "0.15"
dirs = "5"
nnnoiseless = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(windows))'.dependencies]
eframe = "0.31"
egui = "0.31"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }
